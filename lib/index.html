<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #e9e9e9;
            width: 100%;
            max-width: 380px;
            height: 100%;
            max-height: 680px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            border-radius: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        @media (min-width: 400px) {
            .calculator {
                border-radius: 30px;
                height: 680px;
            }
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 0 10px 10px 10px;
        }

        .btn-exit {
            background-color: #e0e0e0;
            border: none;
            outline: none;
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-exit:active {
            background-color: #d0d0d0;
        }

        .display-container {
            padding: 10px;
            text-align: right;
            word-break: break-all;
            word-wrap: break-word;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .current-operand {
            color: #202020;
            font-size: 38px;
            font-weight: 400;
            transition: font-size 0.1s ease;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding-bottom: 5px;
        }

        button.calc-btn {
            background-color: #f2f2f2;
            border: none;
            outline: none;
            font-size: 1.3rem;
            font-weight: bold;
            height: 65px;
            border-radius: 32px;
            cursor: pointer;
            color: #1a1a1a;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.calc-btn:active {
            background-color: #dcdcdc;
        }

        /* زر التساوي البرتقالي البارز */
        .btn-equals {
            background-color: #ff7300 !important;
            color: #ffffff !important;
            font-size: 1.6rem !important;
        }

        .btn-equals:active {
            background-color: #e06500 !important;
        }
    </style>
</head>
<body>

    <div class="calculator" id="calculator-box">
        <div class="top-bar">
            <button class="btn-exit" onclick="exitApp()">Exit</button>
        </div>
        <div class="display-container">
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="buttons-grid">
            <button class="calc-btn" onclick="clearDisplay()">AC</button>
            <button class="calc-btn" onclick="appendPercentage()">%</button>
            <button class="calc-btn" onclick="deleteNumber()">⌫</button>
            <button class="calc-btn" onclick="appendOperator('÷')">÷</button>

            <button class="calc-btn" onclick="appendNumber('7')">7</button>
            <button class="calc-btn" onclick="appendNumber('8')">8</button>
            <button class="calc-btn" onclick="appendNumber('9')">9</button>
            <button class="calc-btn" onclick="appendOperator('×')">×</button>

            <button class="calc-btn" onclick="appendNumber('4')">4</button>
            <button class="calc-btn" onclick="appendNumber('5')">5</button>
            <button class="calc-btn" onclick="appendNumber('6')">6</button>
            <button class="calc-btn" onclick="appendOperator('-')">-</button>

            <button class="calc-btn" onclick="appendNumber('1')">1</button>
            <button class="calc-btn" onclick="appendNumber('2')">2</button>
            <button class="calc-btn" onclick="appendNumber('3')">3</button>
            <button class="calc-btn" onclick="appendOperator('+')">+</button>

            <button class="calc-btn" onclick="appendNumber('00')">00</button>
            <button class="calc-btn" onclick="appendNumber('0')">0</button>
            <button class="calc-btn" onclick="appendNumber('.')">,</button>
            <button class="calc-btn btn-equals" onclick="compute()">=</button>
        </div>
    </div>

    <script>
        let currentOperandElement = document.getElementById('current-operand');
        let currentOperand = '0';
        let resetScreen = false;

        function appendNumber(number) {
            if (currentOperand === '0' || resetScreen) {
                currentOperand = number;
                resetScreen = false;
            } else {
                if (number === '.' && currentOperand.includes('.')) return;
                currentOperand += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            // منع وضع أكثر من عملية وراء بعض بشكل خاطئ
            let lastChar = currentOperand.slice(-1);
            if (['+', '-', '×', '÷'].includes(lastChar)) {
                currentOperand = currentOperand.slice(0, -1) + op;
            } else {
                currentOperand += op;
            }
            resetScreen = false;
            updateDisplay();
        }

        function compute() {
            try {
                let calcExpression = currentOperand.replace(/×/g, '*').replace(/÷/g, '/');
                // التعامل مع النسبة المئوية
                calcExpression = calcExpression.replace(/%/g, '/100');
                
                let result = eval(calcExpression);
                
                // تقريب النتائج الطويلة لتجنب مشاكل الفاصلة العشرية في البرمجة
                result = parseFloat(result.toFixed(10));
                
                currentOperand = result.toString();
                resetScreen = true;
                updateDisplay();
            } catch (error) {
                currentOperand = 'خطأ';
                resetScreen = true;
                updateDisplay();
            }
        }

        function appendPercentage() {
            try {
                let val = parseFloat(currentOperand);
                if (!isNaN(val)) {
                    currentOperand = (val / 100).toString();
                    updateDisplay();
                }
            } catch (e) {}
        }

        function clearDisplay() {
            currentOperand = '0';
            resetScreen = false;
            updateDisplay();
        }

        function deleteNumber() {
            if (resetScreen) return;
            if (currentOperand.length === 1 || currentOperand === 'خطأ') {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        function exitApp() {
            // محاكاة زر الخروج (إغلاق الصفحة أو إعادة توجيهها)
            if (confirm("هل تريد الخروج من التطبيق؟")) {
                window.close();
                // في حال منع المتصفح إغلاق الصفحة برمجياً، يتم إظهار شاشة سوداء أو رسالة
                document.body.innerHTML = "<div style='color:white; background:black; height:100vh; display:flex; justify-content:center; align-items:center; font-size:24px;'>تم إغلاق التطبيق</div>";
            }
        }

        function updateDisplay() {
            currentOperandElement.innerText = currentOperand;
            
            // خاصية تصغير الأرقام تلقائياً عند كثرة خاناتها (Auto-fit)
            let length = currentOperand.length;
            if (length > 16) {
                currentOperandElement.style.fontSize = "20px";
            } else if (length > 11) {
                currentOperandElement.style.fontSize = "26px";
            } else if (length > 8) {
                currentOperandElement.style.fontSize = "32px";
            } else {
                currentOperandElement.style.fontSize = "38px";
            }
        }
    </script>
</body>
</html>
